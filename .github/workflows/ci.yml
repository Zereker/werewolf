name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          verbose: true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # go build ./... 已经覆盖库、示例与 CLI 三个包。
      # 此前另有一个 `go build -o /tmp/example ./example/...` 步骤，
      # 它既与这里重复，又在 example/cli 加进来之后直接失败——
      # -o 指向单个文件时不允许匹配多个包。
      - name: Build
        run: go build -v ./...

      # 只编译不运行是不够的：示例里一个必然 panic 的调用曾就此合入主干。
      # 示例是给使用者照抄的，它跑不通比库本身出问题更误导人。
      - name: Run example
        run: go run ./example > /dev/null

      # CLI 是这个库的第一个真实使用者，脚本跑一整局，
      # 顺带覆盖存档与恢复
      - name: Run CLI
        run: go run ./example/cli -seed 7 < example/cli/testdata/demo.txt > /dev/null
