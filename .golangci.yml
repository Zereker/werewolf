# golangci-lint 配置
# 文档: https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    # unused: 拦住「只写不读」的字段与无人调用的私有函数。
    # 此前 PhaseStep.Order/Required/Multiple、State.SubStep 等一批标识符
    # 声明了却从不读取，CI 完全发现不了。
    - unused

  exclusions:
    # 只排除 proto（生成代码）。
    #
    # 测试曾被整体排除，而测试占了三分之二的代码量——那等于三分之二
    # 无人看管。放开之后立刻查出多处「忽略返回错误、于是一直在错误地
    # 通过」的用例，其中一个甚至因为板子不合法而从未真正开过局。
    paths:
      - proto

    # 启用通用排除预设
    presets:
      - std-error-handling
      - common-false-positives
