# golangci-lint 配置
# 文档: https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    # unused: 拦住「只写不读」的字段与无人调用的私有函数。
    # 此前 PhaseStep.Order/Required/Multiple、State.SubStep 等一批标识符
    # 声明了却从不读取，CI 完全发现不了。
    - unused

  exclusions:
    # 排除 proto（生成代码）、example 和测试文件
    paths:
      - proto
      - example
      - ".*_test\\.go"

    # 启用通用排除预设
    presets:
      - std-error-handling
      - common-false-positives
